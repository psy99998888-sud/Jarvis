<style>
:root{--bg:#eaf4f8;--panel:#fff;--ink:#0a2233;--dim:#547086;--acc:#0a7ea4;--line:#bcd6e2;--user:#d6edf6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#06121c;--panel:#0c2030;--ink:#dff4ff;--dim:#7fa3ba;--acc:#5fd8ff;--line:#1b3d52;--user:#12374d;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;display:flex;flex-direction:column;max-width:640px;margin-inline:auto;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{display:flex;align-items:center;gap:8px;padding:12px 16px}
header input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:700 18px inherit;font-family:inherit;padding:4px 0}
button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[aria-pressed="false"]{color:var(--dim)}
button[aria-pressed="true"].on{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}
.opts{display:flex;gap:8px;padding:0 16px 4px}
.opts select{flex:1;min-width:0}
.core{display:grid;place-items:center;height:168px;flex:none}
.orb{position:relative;width:128px;height:128px;border-radius:50%;display:grid;place-items:center}
.orb i{position:absolute;border-radius:50%;border:2px solid var(--acc)}
.orb .r1{inset:0;border-style:dashed;opacity:.5;animation:spin 24s linear infinite}
.orb .r2{inset:14px;border-color:var(--acc) transparent var(--acc) transparent;animation:spin 8s linear infinite reverse}
.orb .r3{inset:34px;border-width:3px;opacity:.9;animation:beat 3s ease-in-out infinite}
.orb b{width:28px;height:28px;border-radius:50%;background:var(--acc);box-shadow:0 0 28px var(--acc);animation:beat 3s ease-in-out infinite}
.orb[data-s="listening"] b,.orb[data-s="listening"] .r3{animation-duration:.9s}
.orb[data-s="thinking"] .r2{animation-duration:1.2s}
.orb[data-s="speaking"] b,.orb[data-s="speaking"] .r3{animation-duration:.5s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{50%{transform:scale(1.15);opacity:.75}}
@media (prefers-reduced-motion:reduce){.orb i,.orb b{animation:none!important}}
#st{text-align:center;color:var(--dim);font-size:13px;min-height:20px;margin:0 0 6px}
#log{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 14px;border-radius:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.m.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.m.me{align-self:flex-end;background:var(--user)}
form{display:flex;gap:8px;padding:12px 16px}
form input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;padding:10px 14px}
#go{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}
[hidden]{display:none!important}
.kp{display:flex;gap:8px;padding:0 16px 8px}
.kp input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;padding:8px 12px}
</style>
</head>
<body>
<header>
  <input id="name" value="ジャービス" aria-label="アシスタントの名前" maxlength="12">
  <button id="spk" class="on" type="button" aria-pressed="true">声 オン</button>
  <button id="key" type="button" title="APIキーを入れ直す">鍵</button>
</header>
<div class="kp" id="kp" hidden>
  <input id="ki" type="password" placeholder="Googleのキーを貼り付け" autocomplete="off" aria-label="Googleのキー">
  <button id="ks" type="button">保存</button>
</div>
<div class="opts">
  <button id="hf" class="on" type="button" aria-pressed="false">会話モード オフ</button>
  <select id="vs" aria-label="声の種類"><option>標準の声</option></select>
</div>
<div class="core"><div class="orb" id="orb" data-s="idle"><i class="r1"></i><i class="r2"></i><i class="r3"></i><b></b></div></div>
<p id="st" role="status">待機中</p>
<div id="log" aria-live="polite"></div>
<form id="f">
  <button id="mic" type="button">マイク</button>
  <input id="t" placeholder="話しかける、または入力する" autocomplete="off" aria-label="メッセージ">
  <button id="im" type="button">画像</button>
  <button id="go" type="submit">送信</button>
</form>
<script>
const $=id=>document.getElementById(id);
const MODEL="gemini-flash-latest";
const L={idle:"待機中",listening:"聞いています",thinking:"考えています",speaking:"話しています"};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let hist=[],busy=false,voice=true,rec=null,hf=false,vs=[];
try{hist=JSON.parse(store.get("jv-hist")||"[]")}catch(e){hist=[]}
const nm=store.get("jv-name");if(nm)$("name").value=nm;
$("name").addEventListener("change",()=>store.set("jv-name",$("name").value));
function state(s){$("orb").dataset.s=s;$("st").textContent=L[s]}
function bubble(c,t){const d=document.createElement("div");d.className="m "+c;d.textContent=t;$("log").appendChild(d);$("log").scrollTop=1e9;return d}
function save(){while(hist.length>40)hist.shift();while(hist.length&&hist[0].role!=="user")hist.shift();store.set("jv-hist",JSON.stringify(hist))}
function getKey(){return store.get("jv-key")}
function showKey(on){$("kp").hidden=!on;if(on)$("ki").focus()}
$("key").addEventListener("click",()=>showKey($("kp").hidden));
$("ks").addEventListener("click",()=>{const k=$("ki").value.trim();if(k){store.set("jv-key",k);$("ki").value="";showKey(false);bubble("ai","キーを保存しました。話しかけてください。")}});
if(!getKey())showKey(true);
bubble("ai","システム起動。ご用件をどうぞ。");
hist.forEach(m=>bubble(m.role==="user"?"me":"ai",m.content));
function setHf(){$("hf").setAttribute("aria-pressed",hf);$("hf").textContent=hf?"会話モード オン":"会話モード オフ"}
function after(){state("idle");if(hf)setTimeout(listen,300)}
function loadVoices(){
  if(!window.speechSynthesis)return;
  vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
  if(!vs.length)return;
  $("vs").textContent="";
  vs.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=v.name;$("vs").appendChild(o)});
  let k=vs.findIndex(v=>v.name===store.get("jv-voice"));
  if(k<0)k=vs.findIndex(v=>/otoya|hattori|ichiro|male|男/i.test(v.name));
  if(k>=0)$("vs").value=k;
}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(t){
  if(!voice||!window.speechSynthesis){after();return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";
  if(vs[$("vs").value])u.voice=vs[$("vs").value];
  u.pitch=0.75;u.rate=0.95;
  u.onstart=()=>state("speaking");u.onend=u.onerror=after;
  speechSynthesis.speak(u);
}
$("vs").addEventListener("change",()=>{if(vs[$("vs").value])store.set("jv-voice",vs[$("vs").value].name);const v=voice;voice=true;speak("こんにちは。この声で話します。");voice=v});
async function send(text){
  text=text.trim();
  if(!text||busy)return;
  if(IMG.test(text)){makeImage(text);return}
  const key=getKey();if(!key){$("t").value=text;showKey(true);return}
  busy=true;if(window.speechSynthesis)speechSynthesis.cancel();
  bubble("me",text);hist.push({role:"user",content:text});
  const name=$("name").value||"ジャービス";
  const system="あなたは「"+name+"」。ユーザー専用のAIアシスタントで、映画のジャービスのように落ち着いて丁寧、ときどき軽いユーモアを交える日本語で話す。返答は音声で読み上げられるので、2〜3文で短く答え、記号や箇条書きは使わない。ユーザーの発言は音声認識なので、聞き間違いが混じることがある。文脈から本来の意味を推測して答え、どうしても分からないときだけ聞き返す。";
  const ai=bubble("ai","…");state("thinking");
  try{
    const contents=hist.map(m=>({role:m.role==="user"?"user":"model",parts:[{text:m.content}]}));
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+MODEL+":generateContent",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":key},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents,generationConfig:{maxOutputTokens:600}})});
    const d=await r.json();
    if(!r.ok){const e=new Error(d.error&&d.error.message||"error");e.status=r.status;throw e}
    const out=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
    if(!out)throw new Error("返事が空でした");
    ai.textContent=out;hist.push({role:"assistant",content:out});save();
    busy=false;speak(out);return;
  }catch(e){
    hist.pop();if((e.status===400||e.status===403)&&/key/i.test(e.message))showKey(true);
    ai.textContent=(e.status===400||e.status===403)&&/key/i.test(e.message)?"キーが正しくありません。右上の鍵ボタンから入れ直してください。":e.status===429?"無料の利用枠がいっぱいです。しばらくしてからもう一度どうぞ。":"うまくいきませんでした。"+(e.message||"");
    busy=false;after();
  }
}
const IMG=/(画像|絵|イラスト|ポスター|ロゴ|写真).*(生成|作って|描いて|かいて|出して)|描いて|生成して/;
async function makeImage(req){
  if(busy)return;
  const key=getKey();if(!key){$("t").value=req;showKey(true);return}
  busy=true;if(window.speechSynthesis)speechSynthesis.cancel();
  bubble("me",req);
  const ai=bubble("ai","画像を作っています…");state("thinking");
  try{
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+MODEL+":generateContent",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents:[{role:"user",parts:[{text:"次の依頼を、画像生成AI向けの英語の詳しい説明文1つに変換してください。説明文だけを出力。\n依頼:"+req}]}],generationConfig:{maxOutputTokens:200}})});
    const d=await r.json();
    if(!r.ok){const e=new Error(d.error&&d.error.message||"error");e.status=r.status;throw e}
    const p=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(x=>x.text||"").join("").trim().replace(/\s+/g," ");
    if(!p)throw new Error("依頼を読み取れませんでした");
    const url="https://image.pollinations.ai/prompt/"+encodeURIComponent(p)+"?width=768&height=768&nologo=true&seed="+Math.floor(Math.random()*1e6);
    const img=new Image();img.alt=req;img.style.cssText="max-width:100%;border-radius:10px;display:block";
    await new Promise((ok,ng)=>{img.onload=ok;img.onerror=()=>ng(new Error("画像を取得できませんでした。15秒ほど待ってからもう一度どうぞ。"));img.src=url});
    ai.textContent="";ai.appendChild(img);$("log").scrollTop=1e9;
    hist.push({role:"user",content:req},{role:"assistant",content:"(画像を作りました)"});save();
    busy=false;speak("できました。");return;
  }catch(e){
    ai.textContent=(e.status===400||e.status===403)&&/key/i.test(e.message)?"キーが正しくありません。右上の鍵ボタンから入れ直してください。":e.status===429?"無料の利用枠がいっぱいです。しばらくしてからもう一度どうぞ。":"うまくいきませんでした。"+(e.message||"");
    busy=false;after();
  }
}
$("im").addEventListener("click",()=>{const v=$("t").value.trim();if(!v){bubble("ai","作りたい画像の内容を入力してから「画像」を押してください。");return}$("t").value="";makeImage(v)});
$("f").addEventListener("submit",e=>{e.preventDefault();const v=$("t").value;$("t").value="";send(v)});
$("spk").addEventListener("click",()=>{voice=!voice;$("spk").setAttribute("aria-pressed",voice);$("spk").textContent=voice?"声 オン":"声 オフ";if(!voice&&window.speechSynthesis){speechSynthesis.cancel();state("idle")}});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){$("mic").hidden=true;$("hf").hidden=true}
function listen(){
  if(!SR||rec||busy)return;
  rec=new SR();rec.lang="ja-JP";rec.interimResults=true;rec.maxAlternatives=3;let got=false;
  rec.onstart=()=>state("listening");
  rec.onresult=e=>{
    const res=e.results[e.results.length-1];
    if(!res.isFinal){$("t").value=res[0].transcript;return}
    got=true;
    let best=res[0];for(let i=1;i<res.length;i++)if(res[i].confidence>best.confidence)best=res[i];
    $("t").value="";send(best.transcript);
  };
  rec.onend=()=>{rec=null;if(!busy&&!got){state("idle");if(hf)setTimeout(listen,400)}};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){hf=false;setHf();bubble("ai","マイクが使えません。ブラウザの設定でマイクを許可してください。")}};
  try{rec.start()}catch(e){rec=null}
}
$("mic").addEventListener("click",()=>{if(rec){hf=false;setHf();rec.stop()}else listen()});
$("hf").addEventListener("click",()=>{hf=!hf;setHf();if(hf)listen();else if(rec)rec.stop()});
</script>
</body>
